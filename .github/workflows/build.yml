name: Build Native Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号（如 1.1.0），留空则用 tag 或 snapshot'
        required: false
        default: ''
      build_ios:
        description: '是否构建 iOS（macOS runner，耗时较长）'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  APP_NAME: 'truck-freight'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"   # use tag without v, or branch name
          fi
          [ -z "$VERSION" ] || [ "$VERSION" = "main" ] && VERSION="snapshot"
          cp android/app/build/outputs/apk/debug/app-debug.apk ./truck-freight-${VERSION}.apk
          echo "APK_FILE=truck-freight-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./*.apk
          if-no-files-found: error

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" ./*.apk --clobber

  ios:
    name: iOS build (macOS)
    runs-on: macos-latest
    needs: android
    if: github.event.inputs.build_ios != 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor (iOS)
        run: npx cap sync ios

      - name: Build iOS (unsigned simulator build)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive iOS app bundle
        run: |
          mkdir -p dist
          find ios/App/build -name "*.app" -maxdepth 6 -type d | head -1 | xargs -I{} cp -R {} dist/
          (cd dist && zip -r ../truck-freight-ios-simulator.zip .)

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ./truck-freight-ios-simulator.zip
          if-no-files-found: error